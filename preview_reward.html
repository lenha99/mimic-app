<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{margin:0;padding:0;box-sizing:border-box;font-family:Pretendard,sans-serif;}
body{background:#000;display:flex;gap:24px;padding:30px;justify-content:center;}
.phone{width:300px;height:650px;border-radius:38px;overflow:hidden;position:relative;background:radial-gradient(120% 80% at 50% 0%,#1a1530,#0A0A0B 55%);}
.scr{padding:24px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.tag{position:absolute;top:10px;left:0;right:0;text-align:center;color:#444;font-size:10px;letter-spacing:3px;}
.toprow{display:flex;gap:12px;align-items:center;margin-bottom:8px;}
.streak{display:flex;align-items:center;gap:4px;color:#E8FF3A;font-size:13px;font-weight:800;}
.combo{padding:6px 14px;border-radius:20px;background:linear-gradient(90deg,#FF2D78,#FF8A00);color:#000;font-weight:900;font-size:15px;box-shadow:0 0 20px rgba(255,45,120,.5);}
.milestone{font-size:26px;font-weight:900;color:#E8FF3A;text-shadow:0 0 20px #FF2D78;margin:10px 0;}
.label{color:#8A8A92;font-size:13px;font-weight:600;}
.gradecircle{width:170px;height:170px;border-radius:50%;border:5px solid #E8FF3A;display:flex;align-items:center;justify-content:center;font-size:76px;font-weight:900;color:#E8FF3A;box-shadow:0 0 50px rgba(232,255,58,.4);margin:14px 0;}
.score{font-size:50px;font-weight:900;color:#fff;}
.stats{display:flex;gap:14px;margin:20px 0;}
.stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 16px;text-align:center;}
.stat b{font-size:22px;font-weight:900;display:block;}.stat span{font-size:11px;color:#8A8A92;}
.share{background:linear-gradient(145deg,#E8FF3A,#B6FF00);color:#000;font-weight:800;text-align:center;padding:15px;border-radius:16px;width:100%;}
.challenge{border:1.5px solid #FF2D78;color:#FF2D78;font-weight:800;text-align:center;padding:14px;border-radius:16px;width:100%;margin-top:10px;}
.retry{color:#E8FF3A;font-weight:800;margin-top:14px;}
.confetti{position:absolute;width:10px;height:10px;border-radius:50%;}
</style></head><body>
<div class="phone"><div class="tag">RESULT · COMBO x5</div>
<div class="scr" id="scr">
  <div class="toprow"><div class="streak">🔥 7일 연속</div><div class="combo">🔥 COMBO x5</div></div>
  <div class="label">SIUUUU 따라하기</div>
  <div class="milestone">ON FIRE 🔥🔥</div>
  <div class="gradecircle">SS</div>
  <div class="score">97점</div>
  <div class="stats">
    <div class="stat"><b style="color:#E8FF3A">99</b><span>억양</span></div>
    <div class="stat"><b style="color:#00E5FF">95</b><span>음색</span></div>
    <div class="stat"><b style="color:#FF2D78">95</b><span>타이밍</span></div>
  </div>
  <div class="share">⬆ 영상으로 공유하기</div>
  <div class="challenge">⚡ 친구 지목하기</div>
  <div class="retry">한 번 더! 🔥</div>
</div></div>
<script>
const scr=document.getElementById('scr');
const cols=['#E8FF3A','#00E5FF','#FF2D78','#A855F7'];
for(let i=0;i<40;i++){const c=document.createElement('div');c.className='confetti';
c.style.background=cols[i%4];const a=Math.random()*Math.PI*2,d=Math.random()*180;
c.style.left=(150+Math.cos(a)*d)+'px';c.style.top=(180+Math.sin(a)*d*0.6)+'px';
c.style.opacity=0.8;scr.appendChild(c);}
</script>
</body></html>
