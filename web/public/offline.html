<!doctype html>

<head>

<title>MIMIC · 연결 끊김</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0a0a0b; color: #f5f5f7; text-align: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { font-size: 22px; margin: 20px 0 6px; }
  p { margin: 0; color: #8a8a92; font-size: 14px; line-height: 1.6; }
  button {
    margin-top: 24px; min-height: 52px; padding: 0 28px; border: 0; border-radius: 26px;
    background: #e8ff3a; color: #0a0a0b; font: inherit; font-weight: 800; font-size: 16px;
  }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>인터넷 연결이 끊겼어요</h1>
    <p>채점은 서버에서 해서 연결이 필요해요.<br>You're offline — scoring needs a connection.</p>
    <button onclick="location.reload()">다시 시도 · Retry</button>
  </main>
