<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구간 고르기</title>
<style>
  :root {
    --bg: #0d0f14; --panel: #161a22; --line: #262c38;
    --white: #f4f6fa; --ash: #8b93a4; --volt: #d8ff3e; --cyan: #4fd8e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 40px; background: var(--bg); color: var(--white);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: var(--ash); font-size: 13px; margin: 0 0 20px; word-break: keep-all; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  #wave { margin-bottom: 4px; }
  #mini { opacity: .55; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  button {
    background: #222836; color: var(--white); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 13px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { border-color: var(--cyan); }
  button.primary { background: var(--volt); color: #12150c; border-color: var(--volt); font-size: 15px; padding: 11px 20px; }
  button.primary:disabled { opacity: .4; cursor: not-allowed; }
  .readout { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; margin: 16px 0 2px; }
  .readout .dim { color: var(--ash); font-weight: 500; font-size: 15px; }
  .warn { color: #ffb44d; font-size: 13px; min-height: 20px; margin-top: 2px; }
  kbd { background: #222836; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: 12px; }
  .hint { color: var(--ash); font-size: 13px; margin-top: 14px; word-break: keep-all; }
  .done { text-align: center; padding: 40px 12px; }
  .done h2 { color: var(--volt); }
  code { background: #0a0c10; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1 id="title">구간 고르기</h1>
  <p class="meta" id="meta"></p>

  <div class="panel">
    <div id="wave"></div>
    <div id="mini"></div>

    <div class="row">
      <button id="playSel">▶ 구간 재생 <kbd>space</kbd></button>
      <button id="playAll">전체 재생</button>
      <button id="stop">■ 정지</button>
      <button id="zoomIn">확대</button>
      <button id="zoomOut">축소</button>
    </div>

    <div class="readout" id="readout"></div>
    <div class="warn" id="warn"></div>

    <div class="row">
      <span class="meta" style="margin:0">시작</span>
      <button data-edge="start" data-d="-0.25">−0.25</button>
      <button data-edge="start" data-d="-0.05">−0.05</button>
      <button data-edge="start" data-d="0.05">+0.05</button>
      <button data-edge="start" data-d="0.25">+0.25</button>
      <span class="meta" style="margin:0 0 0 10px">끝</span>
      <button data-edge="end" data-d="-0.25">−0.25</button>
      <button data-edge="end" data-d="-0.05">−0.05</button>
      <button data-edge="end" data-d="0.05">+0.05</button>
      <button data-edge="end" data-d="0.25">+0.25</button>
    </div>

    <div class="row" style="margin-top:18px">
      <button class="primary" id="confirm">이 구간으로 만들기</button>
    </div>

    <p class="hint">
      파형을 드래그해서 구간을 잡고, 경계는 끝을 잡아 끌거나 위 버튼으로 미세 조정해.
      <kbd>space</kbd> 구간 재생 · <kbd>←</kbd><kbd>→</kbd> 시작 0.05초 · <kbd>shift</kbd>+<kbd>←</kbd><kbd>→</kbd> 끝 0.05초
      <br>말이 시작되기 직전·끝난 직후로 조금 여유를 두면 돼. 앞뒤 무음은 어차피 자동으로 잘린다.
    </p>
  </div>
</div>

<script type="module">
import WaveSurfer from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@7/dist/wavesurfer.esm.js';
import RegionsPlugin from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@7/dist/plugins/regions.esm.js';

// ingest.py 가 이 자리에 설정 JSON 을 꽂는다.
const cfg = /*__PICK_CONFIG__*/ { offset: 0, window: 60 };
const OFFSET = cfg.offset;          // 이 wav 가 원본의 몇 초부터인지
document.getElementById('title').textContent = cfg.video_title || '구간 고르기';
document.getElementById('meta').textContent =
  `${cfg.channel || ''} · 원본 ${fmt(OFFSET)} ~ ${fmt(OFFSET + cfg.window)} 구간을 보고 있어`;

const regions = RegionsPlugin.create();
const ws = WaveSurfer.create({
  container: '#wave', height: 160, waveColor: '#3d465c', progressColor: '#4fd8e8',
  cursorColor: '#d8ff3e', url: '/audio.wav', plugins: [regions], minPxPerSec: 60,
  hideScrollbar: false,
});
const mini = WaveSurfer.create({
  container: '#mini', height: 40, waveColor: '#2a3142', progressColor: '#2a3142',
  cursorColor: '#d8ff3e', url: '/audio.wav', interact: false,
});

let region = null;

ws.on('decode', () => {
  const dur = ws.getDuration();
  const s = Math.min(cfg.start ?? dur * 0.4, dur - 0.5);
  const e = Math.min(cfg.end ?? s + 2.2, dur);
  region = regions.addRegion({
    start: s, end: e, color: 'rgba(216,255,62,0.18)', drag: true, resize: true,
  });
  update();
});
regions.on('region-updated', update);
regions.enableDragSelection({ color: 'rgba(216,255,62,0.18)' });
regions.on('region-created', r => {
  if (region && r.id !== region.id) region.remove();
  region = r; update();
});

function fmt(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${String(m).padStart(2, '0')}:${s.toFixed(2).padStart(5, '0')}`;
}

function update() {
  if (!region) return;
  const len = region.end - region.start;
  document.getElementById('readout').innerHTML =
    `${len.toFixed(2)}초 <span class="dim">· 원본 ${fmt(OFFSET + region.start)} → ${fmt(OFFSET + region.end)}</span>`;
  // 길이가 UX 를 정한다 — 8초를 넘기면 녹음 화면 흐름 자체가 바뀐다.
  const w = document.getElementById('warn');
  const btn = document.getElementById('confirm');
  if (len < 1.2) { w.textContent = '1.2초보다 짧으면 안 돼 (녹음 창 최소값)'; btn.disabled = true; }
  else if (len > 6.0) { w.textContent = '6초를 넘으면 수동 정지 UI 로 넘어가. 더 짧게 잡아봐'; btn.disabled = true; }
  else if (len > 4.5) { w.textContent = '권장대(1.5~4.5초)보다 길어. 되긴 하는데 타이밍 점수가 박해져'; btn.disabled = false; }
  else { w.textContent = ''; btn.disabled = false; }
}

function nudge(edge, d) {
  if (!region) return;
  const o = { start: region.start, end: region.end };
  o[edge] = Math.max(0, Math.min(ws.getDuration(), o[edge] + d));
  if (o.end - o.start > 0.2) region.setOptions(o);
  update();
}
document.querySelectorAll('[data-edge]').forEach(b =>
  b.onclick = () => nudge(b.dataset.edge, parseFloat(b.dataset.d)));

document.getElementById('playSel').onclick = () => region && region.play();
document.getElementById('playAll').onclick = () => ws.play();
document.getElementById('stop').onclick = () => ws.pause();
let zoom = 60;
document.getElementById('zoomIn').onclick = () => ws.zoom(zoom = Math.min(zoom * 1.6, 600));
document.getElementById('zoomOut').onclick = () => ws.zoom(zoom = Math.max(zoom / 1.6, 12));

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); region && region.play(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); nudge(e.shiftKey ? 'end' : 'start', -0.05); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nudge(e.shiftKey ? 'end' : 'start', 0.05); }
});

document.getElementById('confirm').onclick = async () => {
  if (!region) return;
  const body = { start: OFFSET + region.start, end: OFFSET + region.end };
  await fetch('/pick', { method: 'POST', body: JSON.stringify(body) });
  document.getElementById('app').innerHTML =
    `<div class="done"><h2>구간 확정</h2>
     <p class="meta">${fmt(body.start)} → ${fmt(body.end)} (${(body.end - body.start).toFixed(2)}초)</p>
     <p class="meta">터미널로 돌아가. 이 창은 닫아도 돼.</p></div>`;
  ws.pause();
};
</script>
</body>
</html>
