name: meme_mimic
description: 밈 사운드 따라하기 - 노래방처럼 점수 받는 앱
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any              # flutter_localizations 가 요구하는 버전을 따라감 — 고정 금지
  record: ^5.1.2          # 마이크 녹음
  just_audio: ^0.10.6     # 기준 음성 재생
  http: ^1.2.2            # 채점 API 호출
  http_parser: ^4.0.2
  permission_handler: ^11.3.1
  share_plus: ^13.3.0     # SNS 공유
  path_provider: ^2.1.4   # 임시 녹음 파일 경로
  shared_preferences: ^2.3.2  # 온보딩 1회 판별

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# record 5.2.1이 record_linux를 '<1.0.0'으로 제한하지만, 0.7.2는
# record_platform_interface 1.6.0(startStream/hasPermission 변경)과 호환되지 않아
# 컴파일 에러가 난다. Android만 타깃이므로 컴파일만 되면 되며, 1.x 인터페이스를
# 구현한 record_linux 1.3.1로 강제한다.
dependency_overrides:
  record_linux: 1.3.1

flutter:
  uses-material-design: true
