name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 PR에 연달아 push하면 이전 실행은 취소 (무료 분 절약)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — 분석 + 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # analysis_options.yaml 의 규칙을 info까지 전부 강제.
      # 대부분 `dart fix --apply` 로 자동 수정된다.
      - run: flutter analyze --fatal-infos
      - run: flutter test

  scoring:
    name: 채점 엔진 (Python)
    runs-on: ubuntu-latest
    # 서버/채점 쪽을 건드린 PR에서만 의미가 있지만, 빨라서 항상 돌린다
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest test/scoring_test.py -v

  web:
    name: 웹앱 — 린트 + 빌드
    runs-on: ubuntu-latest
    # 채점 엔진과 같은 이유로 항상 돌린다. npm ci + build 라 빠르다.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # next build 가 타입 검사까지 한다
      - run: npm run build
      - run: npm run lint

  build-apk:
    name: APK 빌드 (main 전용)
    if: github.ref == 'refs/heads/main'
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      # main에 merge될 때마다 최신 APK를 여기서 받아 폰에 설치해볼 수 있다
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
